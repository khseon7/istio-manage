# reviews라는 서비스 안에 어떤 버전(Subset)들이 존재하는지 Istio에게 알려주는 역할
apiVersion: networking.istio.io/v1alpha3
kind: DestinationRule
metadata:
  name: reviews
spec:
  host: reviews
  subsets:
  - name: v1
    labels:
      version: v1
  - name: v2
    labels:
      version: v2
  - name: v3
    labels:
      version: v3
---
# 실제로 트래픽이 들어왔을 때, 어떤 비율로 나누어 보낼지 결정하는 '교통 정리' 역할
# 현재 트래픽이 v1에 60% v2에 30% v3에 10% 배정된다.
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: reviews
spec:
  hosts:
  - reviews
  http:
  - route:
    - destination:
        host: reviews
        subset: v1
      weight: 60
    - destination:
        host: reviews
        subset: v2
      weight: 30
    - destination:
        host: reviews
        subset: v3
      weight: 10
